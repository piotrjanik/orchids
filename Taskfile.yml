version: '3'

vars:
  PROJECT_NAME: orchid-care-guide

tasks:
  default:
    desc: Show available tasks
    cmds:
      - task --list

  # Development tasks
  dev:
    desc: Start development server
    cmds:
      - npm run dev

  build:
    desc: Build production application
    cmds:
      - npm run build

  start:
    desc: Start production server
    cmds:
      - npm run start

  lint:
    desc: Run linter
    cmds:
      - npm run lint

  # Setup tasks
  install:
    desc: Install dependencies
    cmds:
      - npm install

  setup:
    desc: Complete setup (install + environment)
    cmds:
      - task: install
      - cmd: |
          if [ ! -f .env ]; then
            cp .env.example .env
            echo "✅ Created .env from .env.example"
            echo "⚠️  Please update .env with your configuration"
          else
            echo "ℹ️  .env already exists"
          fi
      - cmd: echo "✅ Setup complete!"

  clean:
    desc: Clean build artifacts and dependencies
    cmds:
      - rm -rf .next
      - rm -rf node_modules
      - rm -rf out
      - echo "✅ Clean complete!"

  # Data pipeline tasks
  fetch:
    desc: Fetch resources
    cmds:
      - npm run fetch-resources

  ingest:
    desc: Ingest data to Qdrant
    cmds:
      - npm run ingest-to-qdrant

  generate:
    desc: Generate content
    cmds:
      - npm run generate-content

  pipeline:
    desc: Run full pipeline (fetch → ingest → generate)
    cmds:
      - task: fetch
      - task: ingest
      - task: generate

  # Docker tasks
  docker:up:
    desc: Start Docker services
    cmds:
      - docker-compose up -d
      - echo "✅ Docker services started!"

  docker:down:
    desc: Stop Docker services
    cmds:
      - docker-compose down
      - echo "✅ Docker services stopped!"

  docker:logs:
    desc: View Docker logs
    cmds:
      - docker-compose logs -f

  docker:restart:
    desc: Restart Docker services
    cmds:
      - task: docker:down
      - task: docker:up

  # Test task (placeholder)
  test:
    desc: Run tests
    cmds:
      - echo "🧪 Running tests..."
      - echo "⚠️  No tests configured yet"

  # Utility tasks
  check-env:
    desc: Check if environment is properly configured
    cmds:
      - cmd: |
          if [ -f .env ]; then
            echo "✅ .env file exists"
          else
            echo "❌ .env file not found. Run 'task setup' first."
            exit 1
          fi

  status:
    desc: Show project status
    cmds:
      - echo "📊 Project: {{.PROJECT_NAME}}"
      - cmd: |
          if [ -d node_modules ]; then
            echo "✅ Dependencies installed"
          else
            echo "❌ Dependencies not installed. Run 'task install'"
          fi
      - cmd: |
          if [ -f .env ]; then
            echo "✅ Environment configured"
          else
            echo "❌ Environment not configured. Run 'task setup'"
          fi
      - cmd: |
          if docker ps &> /dev/null; then
            echo "✅ Docker is running"
          else
            echo "⚠️  Docker is not running"
          fi
